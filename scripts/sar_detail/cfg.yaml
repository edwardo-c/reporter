database: ${DATABASE}
out_path: ${OUT_PATH}

sources:
  sales_people:
    kind: xlsx
    path: ${HELPER_INTERFACE}
    sheet: "sales_people"
    header: 0
    register_as: raw_sales_people

  bill_to:
    kind: xlsx
    path: ${CREDIT_EVENTS_PATH}
    sheet: "Bill To"
    header: 5
    register_as: raw_bill_to

  ship_to:
    kind: xlsx
    path: ${CREDIT_EVENTS_PATH}
    sheet: "Ship To"
    header: 5
    register_as: raw_ship_to
  
  # all_direct:
  #   kind: xlsx
  #   path: ${CREDIT_EVENTS_PATH}
  #   sheet: "All Direct"
  #   header: 5
  #   register_as: raw_all_direct

  pos:
    kind: xlsx
    path: ${CREDIT_EVENTS_PATH}
    sheet: "POS"
    header: 5
    register_as: raw_pos

  reclass_pos:
    kind: xlsx
    path: ${HELPER_INTERFACE}
    sheet: "reclass_pos"
    header: 0
    register_as: raw_reclass_pos

  reclass_non_pos:
    kind: xlsx
    path: ${HELPER_INTERFACE}
    sheet: "reclass_non_pos"
    header: 0
    register_as: raw_reclass_non_pos

sql:
  base_dir: ${CREDIT_EVENTS_DIR}
  steps:
    - sales_people.sql
    - bill_to.sql
    - ship_to.sql
    # - all_direct.sql
    - pos.sql
    - reclass_non_pos.sql
    - reclass_pos.sql

union_all:
  final_view:
    name: CreditEvents
    strict: False
  schema:
    module_name: "scripts.sar_detail.schema_contract"
    final_schema_name: FINAL_SCHEMA
  branches:
  - bill_to_logic
  - ship_to_logic
  - pos_logic
  - reclass_pos_logic
  - reclass_non_pos_logic
  # - all_direct_logic