database: ${DATABASE}
test_out: ${CSV_OUT}

credentials:
  username: "${SF_USERNAME}"
  password: "${SF_PASSWORD}"
  security_token: "${SF_TOKEN}"

reports:
  - sf_id: 00OPW00001F09es2AB
    register_as: "raw_sales_people"
    human_readable: True

  - sf_id: 00OPW00001EeX372AF
    register_as: "raw_meeting_events"
    human_readable: False

  - sf_id: "00OPW00001Eh2yr2AB"
    register_as: "raw_new_contacts"
    human_readable: False
  
  - sf_id: "00OPW00001Eguzi2AB"
    register_as: "raw_new_opps"
    human_readable: False

  - sf_id: "00OPW00001EguV52AJ"
    register_as: "raw_new_accts"
    human_readable: False
  
  - sf_id: "00OPW00001Ehefx2AB"
    register_as: "raw_new_quotes"
    human_readable: False
  
  - sf_id: "00OPW00001Eh7k32AB"
    register_as: "raw_converted_leads"
    human_readable: False
  
  - sf_id: "00OPW00001EiOPS2A3"
    register_as: "raw_calls"
    human_readable: False

sql:
  base_dir: ${SQL_BASE_DIR}
  steps:
  - sales_people.sql
  - events.sql
  - contacts.sql
  - opps.sql
  - accts.sql
  - quotes.sql
  - leads.sql
  - calls.sql

union_all:
  final_view:
    name: ActivityLedger
    temp: True
  schema:
    module_name: scripts.activity_ledger.schema
    final_schema_name: FINAL_SCHEMA
  branches:
  - new_contacts
  - new_opps
  - new_accts
  - new_quotes
  - new_leads
  - new_calls
  - new_events

enrich:
  base_dir: ${SQL_BASE_DIR}
  steps:
  - finalize.sql