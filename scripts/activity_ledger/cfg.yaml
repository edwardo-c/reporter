database: ${DATABASE}
test_out: ${CSV_OUT}

credentials:
  username: "${SF_USERNAME}"
  password: "${SF_PASSWORD}"
  security_token: "${SF_TOKEN}"

reports:
  - query_key: "events"
    register_as: "raw_meeting_events"

  - query_key: "contacts"
    register_as: "raw_new_contacts"
  
  - query_key: "opportunities"
    register_as: "raw_new_opps"

  - query_key: "accounts"
    register_as: "raw_new_accts"
  
  - query_key: "quotes"
    register_as: "raw_new_quotes"
  
  - query_key: "leads"
    register_as: "raw_converted_leads"
  
  - query_key: "calls"
    register_as: "raw_calls"

sql:
  base_dir: ${SQL_BASE_DIR}
  steps:
  - scoring.sql
  - events.sql
  - contacts.sql
  - opps.sql
  - accts.sql
  - quotes.sql
  - leads.sql
  - calls.sql

union_all:
  final_view:
    name: ActivityLedger
    temp: True
  schema:
    module_name: scripts.activity_ledger.schema
    final_schema_name: FINAL_SCHEMA
  branches:
  - new_contacts
  - new_opps
  - new_accts
  - new_quotes
  - new_leads
  - new_calls
  - new_events

enrich:
  base_dir: ${SQL_BASE_DIR}
  steps:
  - finalize.sql