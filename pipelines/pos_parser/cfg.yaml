        BillToCustomerZip: "BILLING ZIP"
        BillToCustomerState: ~
        ShipToState: "SHIP TO STATE"
        ShipToZip: "SHIP TO ZIP"
    - file_id: "adi"
      reader: "standard"
      reader_cfg:
        sheet_name: "Full Month (All Data)"
        header: 1
      CanonicalSchema:
        SoldToName: ~
        SaleDate: "INVOICE DATE"
        PiiPartNumber: "VENDOR PART NUMBER"
        ShipQuantity: "UNITS"
        ExtendedSales: "COST OF SALES"
        BillToCustomerZip: ~
        BillToCustomerState: ~
        ShipToState: ~
        ShipToZip: "SHIP TO ZIPCODE"

