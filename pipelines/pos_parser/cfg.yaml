enricher:

  categories:
    auth:
      username: ${ACU_USERNAME}
      password: ${ACU_PW}
    url: ${CATEGORIES_ODATA_URL}
    params:
      "$select": "InventoryID,Category"
      "$format": "json"
    cfg:
      "left": "PiiPartNumber"
      "right": "PiiCategory"
    additional:
      file_path: ${ADDITIONAL_CATEGORIES}
  zip_map:
    file_path: ${STATE_ASSIGNMENTS}
    sheet: "As of 1-1-25"
    usecols: [1, 3, 4, 7]
    skiprows: 2



  credit_rules:
    
    - kind: "mapping"
      left: "Customer"
      mapping: 
        "PETRA": "NAEGELE"
        "ADI": "NAEGELE"
    
    - kind: "mapping"
      left: "BuyerName"
      map_args: 
        path: ${POS_EXCEPTIONS}
        sheet: "Exceptions Eff 5-1-25"
        usecols: [6, 8]
        skiprows: 2
    
    - kind: "mapping"
      left: "SoldToName"
      map_args: 
        path: ${POS_EXCEPTIONS}
        sheet: "Exceptions Eff 5-1-25"
        usecols: [0, 3]
        skiprows: 2

    - kind: "zip_range"
      state_col: BillToCustomerState
      zip_col: BillToCustomerZip
      data_dict: {"State": ["IL", "IL"], "ZipMin": [60000, 61200], "ZipMax": [61199, 62999], "SalesRep": ["SCHNEIDER", "WOLFE"]}
      # range_args:
      #   path: ${STATE_ASSIGNMENTS}
      #   sheet: "As of 1-1-25"
      #   usecols: [1, 3, 4, 7]
      #   skiprows: 2


    - kind: "zip_range"
      state_col: BillToCustomerState
      zip_col: BillToCustomerZip
      range_args:
        path: ${STATE_ASSIGNMENTS}
        sheet: "As of 1-1-25"
        usecols: [1, 3, 4, 7]
        skiprows: 2
    
    - kind: "mapping"
      left: "BillToCustomerState"
      map_args:
        path: ${STATE_ASSIGNMENTS}
        sheet: "As of 1-1-25"
        usecols: [1, 7]
        skiprows: 1

    - kind: "zip_range"
      state_col: ShipToState
      zip_col: ShipToZip
      range_args:
        path: ${STATE_ASSIGNMENTS}
        sheet: "As of 1-1-25"
        usecols: [1, 3, 4, 7]
        skiprows: 2
    
    - kind: "mapping"
      left: "ShipToState"
      map_args:
        path: ${STATE_ASSIGNMENTS}
        sheet: "As of 1-1-25"
        usecols: [1, 7]
        skiprows: 1
    

      
      
      
