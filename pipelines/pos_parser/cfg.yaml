      UnitCost: "Base_Cost"
      ExtendedSales: "Extend_Base_Cost"
      BillToCustomerZip: "bill_to_cust_zip"
      BillToCustomerState: "bill_to_cust_state"
      ShipToState: "ship_to_state"
      ShipToZip: "ship_to_zip"
      BuyerName: ~
    return_id: ["16", "14"]

enricher:

  categories:
    auth:
      username: ${ACU_USERNAME}
      password: ${ACU_PW}
    url: ${CATEGORIES_ODATA_URL}
    params:
      "$select": "InventoryID,Category"
      "$format": "json"
    cfg:
      "left": "PiiPartNumber"
      "right": "PiiCategory"
    additional:
      file_path: ${ADDITIONAL_CATEGORIES}

  credit_rules:
    
    - kind: "mapping"
      left: "Customer"
      mapping: 
        "PETRA": "NAEGELE"
        "ADI": "NAEGELE"
      rule_id: "Account Owner"
    
    - kind: "mapping"
      left: "BuyerName"
      map_args: 
        path: ${POS_EXCEPTIONS}
        sheet: "Exceptions Eff 5-1-25"
        usecols: [6, 8]
        skiprows: 2
      rule_id: "Exertis Almo SLS Name"

    - kind: "mapping"
      left: "SoldToName"
      map_args: 
        path: ${POS_EXCEPTIONS}
        sheet: "Exceptions Eff 5-1-25"
        usecols: "A:D"
        skiprows: 2
        filter_col: "Exception"
        filter_val: "Buyer Name - Hospitality"
        key_col_name: "Buyers"
        val_col_name: "SalesRep"
      rule_id: "Buyer Name - Hospitality"
    
    - kind: "mapping"
      left: "SoldToName"
      map_args: 
        path: ${POS_EXCEPTIONS}
        sheet: "Exceptions Eff 5-1-25"
        usecols: "A:D"
        skiprows: 2
        filter_col: "Exception"
        filter_val: "Buyer Name - Disty"
        key_col_name: "Buyers"
        val_col_name: "SalesRep"
      rule_id: "Buyer Name - Disty"
    
    - kind: "mapping"
      left: "SoldToName"
      map_args: 
        path: ${POS_EXCEPTIONS}
        sheet: "Exceptions Eff 5-1-25"
        usecols: "A:D"
        skiprows: 2
        filter_col: "Exception"
        filter_val: "Buyer Name - MZ"
        key_col_name: "Buyers"
        val_col_name: "SalesRep"
      rule_id: "Buyer Name - MZ"
    
    - kind: "mapping"
      left: "SoldToName"
      map_args: 
        path: ${POS_EXCEPTIONS}
        sheet: "Exceptions Eff 5-1-25"
        usecols: "A:D"
        skiprows: 2
        filter_col: "Exception"
        filter_val: "Buyer Name - ST"
        key_col_name: "Buyers"
        val_col_name: "SalesRep"
      rule_id: "Buyer Name - ST"

    - kind: "mapping"
      left: "SoldToName"
      map_args: 
        path: ${POS_EXCEPTIONS}
        sheet: "Exceptions Eff 5-1-25"
        usecols: "A:D"
        skiprows: 2
        filter_col: "Exception"
        filter_val: "Buyer Name - NSP"
        key_col_name: "Buyers"
        val_col_name: "SalesRep"
      rule_id: "Buyer Name - NSP"

    - kind: "zip_range"
      state_col: BillToCustomerState
      zip_col: BillToCustomerZip
      data_dict:
        "State": ["IL", "IL"] 
        "ZipMin": [60000, 61200] 
        "ZipMax": [61199, 62999]
        "SalesRep": ["WARREN", "WOLFE"]
      rule_id: "IL Bill To Zip"

    - kind: "zip_range"
      state_col: BillToCustomerState
      zip_col: BillToCustomerZip
      data_dict:
        "State": ["CA", "CA"] 
        "ZipMin": [90000, 93300] 
        "ZipMax": [93301, 96699]
        "SalesRep": ["BLANKENSOP", "NORTHWEST"]
      rule_id: "CA Bill To Zip"

    - kind: "mapping"
      left: "BillToCustomerState"
      map_args:
        path: ${STATE_ASSIGNMENTS}
        sheet: "As of 1-1-26"
        usecols: [1, 7]
        skiprows: 1
      rule_id: "Bill To State"
    
    - kind: "mapping"
      left: "ShipToState"
      map_args:
        path: ${STATE_ASSIGNMENTS}
        sheet: "As of 1-1-26"
        usecols: [1, 7]
        skiprows: 1
      rule_id: "Ship To State"
    

      
      
      
