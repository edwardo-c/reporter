        BillToCustomerZip: "Bill To Postal Code"
        BillToCustomerState: "Bill To State"
        ShipToState: "Ship To State"
        ShipToZip: "Ship To Postal Code"
    
    - file_id: "dhd"
      reader: "standard"
      CanonicalSchema:
