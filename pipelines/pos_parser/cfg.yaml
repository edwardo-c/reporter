pos_dir: ${DIR_TO_PARSE}
pos_sales_db: ${POS_DB}

files_cfg:
  - file_id: "accu-tech"
    reader: "standard"
    src_id: "ACCUTECH"
    src_col_name: "Customer"
    CanonicalSchema:
      SoldToName: "Bill To Customer Name"
      SaleDate: ~
      PiiPartNumber: "Mfr Item #"
      PartDescription: ~
      IsReturn: ~
      ShipQuantity: "Qty"
      UnitCost: ~
      ExtendedSales: "Adj EXT Cost"
      BillToCustomerZip: "Bill To Customer Postal Code"
      BillToCustomerState: ~
      ShipToState: "Ship To State/Province"
      ShipToZip: "Ship To Postal Code"
      BuyerName: ~
    return_id: ~ # value that signifies a return in the IsReturn Column
    
  - file_id: "adi"
    reader: "standard"
    src_id: "ADI"
    src_col_name: "Customer"
    reader_cfg:
      sheet_name: "Full Month (All Data)"
      header: 1
    CanonicalSchema:
      SoldToName: ~
      SaleDate: "INVOICE DATE"
      PiiPartNumber: "VENDOR PART NUMBER"
      PartDescription: "ITEM DESCRIPTION"
      IsReturn: ~
      ShipQuantity: "UNITS"
      UnitCost: ~
      ExtendedSales: "COST OF SALES"
      BillToCustomerZip: ~
      BillToCustomerState: ~
      ShipToState: ~
      ShipToZip: "SHIP TO ZIPCODE"
      BuyerName: ~
    return_id: ~

  - file_id: "petra" 
