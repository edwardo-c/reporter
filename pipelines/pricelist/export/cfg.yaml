out_map:
    "Neptune": ${NEP_OUT} 
    "Peerless-AV": ${PAV_OUT} 

acu_auth:
    username: ${ACU_USERNAME}
    password: ${ACU_PW}

data_cfg:
    "eol":
        url: ${EOL_ODATA}
        params: 
            "$format": "json"
        cleaner_cfg:
            str_cols:
                - "InventoryID" 
                - "ProductLifeCycleManagement"
                - "ItemStatus"
        "out": ${EOL_DIR}

    price_lookup_all_dir: ${PRICE_LOOKUP_ALL_DIR}
            
    "master_pricing":
        url: ${PRICE_LOOKUP_ALL}
        params:
            "$select":
                "PartNumber,Price,MAPUS,MAPCA,MSRP,UPC,CountryOfOrigin,Category\
                ,Returnable,Description,Lengthin,Widthin,Heightin,ShipWeightlb\
                ,ExpirationDate,Customer,CustomerName,Promotion,PriceGroup\
                ,CustomerPriceClass"
            "$format": "json"
        cleaner_cfg:
            str_cols: 
                - PartNumber
                - Customer 
            col_order:
                - "PartNumber"
                - "Price"
                - "MAPUS"
                - "MAPCA"
                - "MSRP"
                - "UPC"
                - "CountryOfOrigin"
                - "Category"
                - "Returnable"
                - "Description"
                - "Lengthin"
                - "Widthin"
                - "Heightin"
                - "ShipWeightlb"
                - "ExpirationDate"
                - "Customer"
                - "CustomerName"
                - "Promotion"
                - "PriceGroup"
                - "CustomerPriceClass"



        
        