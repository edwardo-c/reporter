attachments:
    "Peerless-AV": ${PAV_FINISHED_LISTS}
    "Neptune": ${NEP_FINISHED_LISTS}

recipient_log_out_dir: ${RECIPIENT_LOG_DIR}

acumatica:
    auth:
      username: ${ACU_USERNAME}
      password: ${ACU_PW}
    customers:
      url: ${CUSTOMERS_FEED}
      params: 
        $select: "CustomerID,CustomerName"
        $format: "json"

"salesforce":
    "task_params":
        "Subject": "TEST - Hello From Python!"
        "Status": "Completed"
        "WhatId": "701PW0000107JqDYAU"
        "WhoId": "0056A000000ewTWQAY"
    "auth":
        "username": ${SF_USER}
        "password": ${SF_PW}
        "security_token": ${SF_TOKEN}
    "data":
        "internal":
            "soql": |
                SELECT 
                    Id,
                    ACU_Customer_ID__c,
                    Price_List_Delivery_to_Salesperson__r.Email
                FROM Account
                WHERE 
                    Price_List_Delivery_to_Salesperson__c != NULL
                    AND ACU_Customer_ID__c != NULL
            "clean_plan":
                str_cols: 
                    - "ACU Customer ID" 
                    - "Email"
                    - "Id"
                rename_map: 
                    "ACU_CUSTOMER_ID__c": "ACU Customer ID"
                    "Price_List_Delivery_to_Salesperson__r.Email": "Email"
        "external": 
            "soql": |
                SELECT 
                    Id,
                    Email,
                    Account.ACU_CUSTOMER_ID__c
                FROM Contact
                WHERE (
                    Account.Price_List_Delivery_to_Salesperson__c = NULL
                    AND Receives_Pricing__c = true
                    AND Account.ACU_CUSTOMER_ID__c != NULL
                    AND Email != NULL
                    AND (Contact_Status__c = 'Active' OR Contact_Status__c = NULL)
                )
            clean_plan:
                str_cols: 
                    - "Id" 
                    - "Email"
                    - "ACU Customer ID"
                rename_map:
                    "Account.ACU_CUSTOMER_ID__c": "ACU Customer ID"

            